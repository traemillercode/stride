<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Stride</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/brand-mark.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/static/supabase.js"></script>
<style>
  .profile-container { max-width:720px; margin:40px auto; padding:0 24px; }
  .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:32px; }
  .avatar { width:72px; height:72px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:var(--text-muted); flex-shrink:0; border:2px solid var(--border-visible); }
  .profile-name { font-size:28px; margin-bottom:2px; }
  .profile-bio { color:var(--text-muted); font-size:14px; margin-top:4px; }
  .profile-meta { display:flex; gap:24px; margin-top:10px; font-size:13px; color:var(--text-dim); }
  .profile-meta strong { color:var(--charcoal); font-weight:700; }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; margin-bottom:32px; }
  .stat-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; text-align:center; }
  .stat-value { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:800; color:var(--cobalt); }
  .stat-label { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }
  .section-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; margin-bottom:16px; color:var(--charcoal); }
  .activity-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:12px; display:flex; align-items:center; gap:16px; }
  .activity-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .activity-icon.run { background:rgba(30,94,245,0.1); color:var(--cobalt); }
  .activity-details { flex:1; }
  .activity-type { font-weight:700; font-size:14px; }
  .activity-stats { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .activity-source { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .follow-btn { padding:10px 22px; font-size:14px; }
  .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); }
  .site-header { border-bottom:1px solid var(--border); background:var(--surface-1); }
  .site-header .inner { max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .site-logo { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.02em; color:var(--charcoal); }
  .site-nav { display:flex; gap:20px; align-items:center; }
  .nav-link { font-size:14px; font-weight:500; color:var(--text-muted); }
  .nav-link:hover { color:var(--charcoal); }
  .user-nav { display:flex; align-items:center; gap:12px; }
  .user-nav-avatar { width:32px; height:32px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--text-muted); }
  .user-nav-name { font-size:13px; font-weight:600; color:var(--charcoal); }
  .sign-out-btn { font-size:12px; color:var(--text-muted); cursor:pointer; background:none; border:none; font-family:inherit; padding:0; }
  .sign-out-btn:hover { color:var(--magenta); }
  .loading { text-align:center; padding:60px 20px; color:var(--text-muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="site-logo">Stride</a>
    <nav class="site-nav" id="main-nav">
      <a href="/races" class="nav-link">Races</a>
      <a href="/resources" class="nav-link">Resources</a>
      <a href="/community" class="nav-link">Community</a>
      <span id="nav-auth-area"></span>
    </nav>
  </div>
</header>

<main>
  <div class="profile-container" id="profile-content">
    <div class="loading">Loading your profile...</div>
  </div>
</main>

<script>
(function() {
  var container = document.getElementById('profile-content');
  var navAuth = document.getElementById('nav-auth-area');

  // Check if we're viewing someone else's profile
  var urlParams = new URLSearchParams(window.location.search);
  var viewingUserId = urlParams.get('user');

  function formatDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function formatPace(secsPerMi) {
    if (!secsPerMi) return '--';
    var min = Math.floor(secsPerMi / 60);
    var sec = Math.round(secsPerMi % 60);
    return min + ':' + (sec < 10 ? '0' : '') + sec + ' /mi';
  }

  function formatDistance(mi) {
    if (!mi) return '--';
    return parseFloat(mi).toFixed(1) + ' mi';
  }

  function getActivityIcon(type) {
    var icons = { run:'🏃', ride:'🚴', swim:'🏊', walk:'🚶', workout:'💪' };
    return icons[type] || '🏃';
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().substring(0, 2);
  }

  function renderProfile(user, activities, stats, userCircles) {
    var html = '';

    // Profile header
    html += '<div class="profile-header">';
    html += '<div class="avatar">' + getInitials(user.display_name) + '</div>';
    html += '<div>';
    html += '<h1 class="font-display profile-name">' + (user.display_name || 'Runner') + '</h1>';
    if (user.bio) html += '<p class="profile-bio">' + user.bio + '</p>';
    html += '<div class="profile-meta">';
    html += '<span><strong>' + (stats.followers || 0) + '</strong> followers</span>';
    html += '<span><strong>' + (stats.following || 0) + '</strong> following</span>';
    html += '<span>Member since ' + formatDate(user.created_at) + '</span>';
    html += '</div>';
    // Follow/unfollow button (only if viewing someone else)
    if (viewingUserId && viewingUserId !== user.id) {
      html += '<button class="btn btn-primary follow-btn" style="margin-top:12px;" id="follow-btn" data-userid="' + viewingUserId + '">Follow</button>';
    }
    html += '</div></div>';

    // Stats
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-value">' + formatDistance(stats.totalMiles) + '</div><div class="stat-label">Total miles</div></div>';
    html += '<div class="stat-card"><div class="stat-value">' + formatPace(stats.avgPace) + '</div><div class="stat-label">Avg pace</div></div>';
    html += '<div class="stat-card"><div class="stat-value">' + (stats.activityCount || 0) + '</div><div class="stat-label">Activities</div></div>';
    html += '</div>';

    // My Circles
    html += '<h2 class="section-title">My circles</h2>';
    if (!userCircles || !userCircles.length) {
      html += '<div class="empty-state" style="padding:20px;border:1px dashed var(--border-visible);border-radius:var(--radius);">';
      html += '<p style="font-size:14px;">Not a member of any circles yet.</p>';
      html += '<a href="/community/circles" class="btn btn-primary" style="margin-top:12px;font-size:13px;">Discover circles</a>';
      html += '</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      userCircles.forEach(function(c) {
        html += '<a href="/community/circles/' + c.id + '" style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;">';
        html += '<div><span style="font-weight:600;font-size:14px;">' + (c.name || 'Circle') + '</span>';
        html += '<span style="font-size:12px;color:var(--text-dim);margin-left:12px;">' + (c.member_count || 1) + ' member' + ((c.member_count || 1) !== 1 ? 's' : '') + '</span></div>';
        html += '<span style="font-size:12px;color:var(--cobalt);font-weight:600;">View →</span>';
        html += '</a>';
      });
      html += '</div>';
    }

    // Activity feed
    html += '<h2 class="section-title">Recent activities</h2>';
    if (!activities || !activities.length) {
      html += '<div class="empty-state"><p>No activities yet.</p><p style="margin-top:8px;">Connect a device or start logging runs to see them here.</p></div>';
    } else {
      activities.forEach(function(a) {
        html += '<div class="activity-card">';
        html += '<div class="activity-icon ' + a.type + '">' + getActivityIcon(a.type) + '</div>';
        html += '<div class="activity-details">';
        html += '<div class="activity-type">' + (a.type || 'Run') + (a.route_name ? ': ' + a.route_name : '') + '</div>';
        html += '<div class="activity-stats">' + formatDistance(a.distance_mi) + ' · ' + formatPace(a.avg_pace_secs) + (a.elevation_ft ? ' · ' + a.elevation_ft + 'ft' : '') + '</div>';
        html += '<div class="activity-source">via ' + (a.source || 'manual') + ' · ' + formatDate(a.posted_at) + '</div>';
        html += '</div></div>';
      });
    }

    container.innerHTML = html;

    // Update nav
    renderNavAuth(user);
  }

  function renderNavAuth(user) {
    if (user) {
      navAuth.innerHTML = '<div class="user-nav">' +
        '<div class="user-nav-avatar">' + getInitials(user.display_name) + '</div>' +
        '<a href="/profile" class="user-nav-name">' + (user.display_name || 'Profile') + '</a>' +
        '<button class="sign-out-btn" onclick="StrideAuth.signOut(function(){window.location.href='/'})">Sign out</button>' +
        '</div>';
    } else {
      navAuth.innerHTML = '<a href="/auth/signin" class="nav-link" style="font-weight:600;color:var(--cobalt);">Sign in</a>';
    }
  }

  function loadProfile() {
    StrideAuth.getCurrentUser(function(err, user) {
      if (err || !user) {
        // Not logged in
        container.innerHTML = '<div class="empty-state" style="padding:80px 20px;">' +
          '<h2 class="font-display" style="font-size:24px;margin-bottom:12px;">Sign in to view your profile</h2>' +
          '<p class="text-muted">Track your miles, connect with other runners, and find your pace.</p>' +
          '<a href="/auth/signin" class="btn btn-primary" style="margin-top:20px;">Sign in</a>' +
          '<p style="margin-top:12px;font-size:13px;color:var(--text-dim);">New to Stride? <a href="/auth/signup" style="color:var(--cobalt);text-decoration:underline;">Create an account</a></p>' +
          '</div>';
        renderNavAuth(null);
        return;
      }

      // Fetch profile data from API
      var profileUrl = '/api/profile?userId=' + encodeURIComponent(viewingUserId || user.id);

      fetch(profileUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          // If viewing own profile, also fetch circles
          if (!viewingUserId) {
            StrideAuth.getSession(function(err, session) {
              if (err || !session) {
                renderProfile(data.user || { id:user.id, display_name:user.user_metadata.display_name || user.email, created_at:user.created_at }, data.activities || [], data.stats || {}, []);
                return;
              }
              fetch('/api/circles', { headers: { 'Authorization': 'Bearer ' + session.access_token } })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                  renderProfile(data.user || { id:user.id, display_name:user.user_metadata.display_name || user.email, created_at:user.created_at }, data.activities || [], data.stats || {}, (d.circles || []).slice(0, 5));
                })
                .catch(function() {
                  renderProfile(data.user || { id:user.id, display_name:user.user_metadata.display_name || user.email, created_at:user.created_at }, data.activities || [], data.stats || {}, []);
                });
            });
          } else {
            renderProfile(data.user || { id:user.id, display_name:user.user_metadata.display_name || user.email, created_at:user.created_at }, data.activities || [], data.stats || {}, []);
          }
        })
        .catch(function() {
          // API not available — render from auth data
          renderProfile({
            id: user.id,
            display_name: (user.user_metadata && user.user_metadata.display_name) || user.email,
            created_at: user.created_at
          }, [], { followers:0, following:0, totalMiles:0, avgPace:0, activityCount:0 }, []);
        });

      renderNavAuth({ id:user.id, display_name:(user.user_metadata && user.user_metadata.display_name) || user.email });
    });
  }

  loadProfile();
})();
</script>

</body>
</html>
