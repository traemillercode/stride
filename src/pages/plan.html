<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stride — Your roadmap</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/brand-mark.svg" type="image/svg+xml">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="site-logo">Stride</a>
    <nav class="site-nav">
      <a href="/races" class="nav-link">Races</a><a href="/resources" class="nav-link">Resources</a><a href="/community">Community</a>
    </nav>
  </div>
</header>

<main>
<div class="container py-12" id="plan-app">
  <a href="/" class="text-sm text-cobalt" style="text-decoration:underline;">← Back to Stride</a>
  <div id="plan-content" class="mt-6"></div>
</div>
</main>

<footer class="site-footer">
  <p>Stride — Built for every runner</p>
  <div class="links"><a href="/races" class="nav-link">Races</a><a href="/resources" class="nav-link">Resources</a><a href="/community">Community</a><span aria-hidden="true" style="color:var(--text-dim);margin:0 8px;">|</span><a href="/contact" class="nav-link">Contact</a>
    <a href="/privacy" class="nav-link">Privacy</a><a href="/terms" class="nav-link">Terms</a><a href="/cookies" class="nav-link">Cookies</a><a href="/dmca" class="nav-link">DMCA</a>
    <a href="/data-deletion" class="nav-link">Data deletion</a><a href="/health-disclosure" class="nav-link">Health disclosure</a><a href="/accessibility" class="nav-link">Accessibility</a></div>
</footer>

<script src="/static/pacing.js"></script>
<script src="/static/planBuilder.js"></script>
<script>
(function() {
  var path = window.location.pathname;
  var planId = path.split("/").pop();
  var raw = sessionStorage.getItem("plan-" + planId);
  var container = document.getElementById("plan-content");

  if (!raw) {
    container.innerHTML = '<div style="text-align:center;padding:80px 0;"><p class="text-muted">No roadmap found. <a href="/" style="color:var(--cobalt);text-decoration:underline;">Start fresh</a>.</p></div>';
    return;
  }

  var plan;
  try {
    plan = JSON.parse(raw);
  } catch(e) {
    container.innerHTML = '<div style="text-align:center;padding:80px 0;"><p class="text-muted">Something went wrong loading your plan. <a href="/" style="color:var(--cobalt);text-decoration:underline;">Start fresh</a>.</p></div>';
    return;
  }

  if (plan.error) {
    container.innerHTML = '<div style="text-align:center;padding:80px 0;"><p class="text-muted">' + (plan.message || "Something went wrong building your plan. Try again.") + ' <a href="/" style="color:var(--cobalt);text-decoration:underline;">Start fresh</a>.</p></div>';
    return;
  }

  // Show loading spinner briefly
  container.innerHTML = '<div class="loading-plan" style="text-align:center;padding:100px 0;"><div class="loading-spinner"></div><p class="text-muted mt-4">Building your roadmap...</p></div>';

  setTimeout(function() {
    renderPlan(plan);
  }, 500);

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === "className") el.className = attrs[k];
        else if (k === "style") { for (var sk in attrs[k]) el.style[sk] = attrs[k][sk]; }
        else if (k === "onclick") el.onclick = attrs[k];
        else if (k === "html") el.innerHTML = attrs[k];
        else if (k === "text") el.textContent = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
    }
    if (children) {
      if (typeof children === "string") el.textContent = children;
      else if (Array.isArray(children)) children.forEach(function(c) { if (c) el.appendChild(c); });
      else el.appendChild(children);
    }
    return el;
  }

  function statBox(label, value) {
    var div = h("div", { className: "stat-box" });
    div.appendChild(h("span", { className: "stat-label", text: label }));
    div.appendChild(h("span", { className: "stat-value", text: value, style: { textTransform: "capitalize" } }));
    return div;
  }

  function paceRow(label, pace, feel, highlight) {
    var tr = h("tr", { style: highlight ? "background:rgba(30,94,245,0.1);" : "" });
    tr.appendChild(h("td", { className: "font-semibold " + (highlight ? "text-cobalt" : ""), style: { padding: "12px 16px" }, text: label }));
    tr.appendChild(h("td", { style: { padding: "12px 16px", fontFamily: "monospace" }, text: formatPace(pace) }));
    tr.appendChild(h("td", { className: "text-muted", style: { padding: "12px 16px" }, text: feel }));
    return tr;
  }

  function downloadPDF() {
    var printDiv = document.createElement("div");
    printDiv.id = "print-plan";
    printDiv.style.display = "none";

    var html = '';
    html += '<div class="plan-print-header">';
    html += '<span class="wordmark">Stride</span>';
    html += '<p style="margin-top:8px;font-size:13px;color:#555;">Your ' + plan.totalWeeks + '-week training roadmap</p>';
    html += '</div>';

    html += '<div style="margin-bottom:24px;">';
    html += '<h2 style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px;">Runner summary</h2>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<tr><td style="padding:4px 12px 4px 0;color:#555;">Path</td><td style="padding:4px 0;">' + plan.segment.replace(/_/g, " ") + '</td></tr>';
    html += '<tr><td style="padding:4px 12px 4px 0;color:#555;">Weekly mileage</td><td style="padding:4px 0;">' + plan.weeklyMileage + ' mi</td></tr>';
    html += '<tr><td style="padding:4px 12px 4px 0;color:#555;">Goal race</td><td style="padding:4px 0;">' + plan.goalDistance + '</td></tr>';
    html += '<tr><td style="padding:4px 12px 4px 0;color:#555;">Race date</td><td style="padding:4px 0;">' + (plan.goalRaceDate || "TBD") + '</td></tr>';
    html += '</table></div>';

    html += '<div style="margin-bottom:24px;page-break-inside:avoid;">';
    html += '<h2 style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px;">Pace targets</h2>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid #ccc;">';
    html += '<thead><tr style="background:#f5f5f5;"><th style="padding:8px 12px;text-align:left;border-bottom:1px solid #ccc;">Training pace</th><th style="padding:8px 12px;text-align:left;border-bottom:1px solid #ccc;">Per mile</th><th style="padding:8px 12px;text-align:left;border-bottom:1px solid #ccc;">Feel</th></tr></thead>';
    html += '<tbody>';
    html += '<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;">Easy</td><td style="padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;">' + formatPace(plan.paces.easySecsPerMi) + '</td><td style="padding:8px 12px;border-bottom:1px solid #eee;color:#555;">Conversational</td></tr>';
    html += '<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;">Tempo</td><td style="padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;">' + formatPace(plan.paces.tempoSecsPerMi) + '</td><td style="padding:8px 12px;border-bottom:1px solid #eee;color:#555;">Comfortably hard</td></tr>';
    html += '<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;">Threshold</td><td style="padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;">' + formatPace(plan.paces.thresholdSecsPerMi) + '</td><td style="padding:8px 12px;border-bottom:1px solid #eee;color:#555;">Lactate threshold</td></tr>';
    html += '<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;">Long run</td><td style="padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;">' + formatPace(plan.paces.longRunSecsPerMi) + '</td><td style="padding:8px 12px;border-bottom:1px solid #eee;color:#555;">Steady</td></tr>';
    html += '<tr style="background:#fafafa;"><td style="padding:8px 12px;font-weight:700;">Race goal</td><td style="padding:8px 12px;font-family:monospace;font-weight:700;">' + formatPace(plan.paces.raceGoalSecsPerMi) + '</td><td style="padding:8px 12px;color:#555;">Finish: ' + formatDuration(plan.paces.predictedFinishTimeSecs) + '</td></tr>';
    html += '</tbody></table></div>';

    html += '<div class="page-break"></div>';
    html += '<h2 style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;margin-bottom:12px;">Week-by-week schedule</h2>';
    plan.weeks.forEach(function(week) {
      html += '<div style="margin-bottom:16px;page-break-inside:avoid;">';
      html += '<h3 style="font-size:14px;font-weight:700;margin-bottom:4px;">Week ' + week.weekNumber + ' \u2014 ' + week.phase + ' <span style="font-weight:400;color:#555;">(' + week.totalMileage + ' mi)</span></h3>';
      html += '<table style="width:100%;border-collapse:collapse;font-size:12px;border:1px solid #eee;">';
      week.workouts.forEach(function(w) {
        var detail = w.targetDistance ? w.targetDistance + ' mi' : (w.targetDuration ? w.targetDuration + ' min' : '\u2014');
        html += '<tr><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;font-weight:600;">' + DAY_LABELS[w.dayOfWeek] + '</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;text-transform:capitalize;">' + w.type + '</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">' + detail + '</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;color:#777;">' + (w.notes || '') + '</td></tr>';
      });
      html += '</table></div>';
    });

    html += '<div class="print-footer">Built with Stride \u00b7 ' + new Date().toLocaleDateString() + '</div>';

    printDiv.innerHTML = html;
    document.body.appendChild(printDiv);

    var oldTitle = document.title;
    document.title = 'Stride \u2014 ' + plan.totalWeeks + '-week roadmap';
    window.print();
    document.title = oldTitle;
    document.body.removeChild(printDiv);
  }

  function downloadICS() {
    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Stride//Roadmap//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
    ];

    var startDate;
    if (plan.goalRaceDate) {
      var raceDate = new Date(plan.goalRaceDate + 'T00:00:00');
      var totalDays = plan.totalWeeks * 7;
      startDate = new Date(raceDate.getTime() - totalDays * 86400000);
    } else {
      startDate = new Date();
    }
    var dow = startDate.getDay();
    var mondayOffset = dow === 0 ? -6 : 1 - dow;
    startDate.setDate(startDate.getDate() + mondayOffset);

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function toICSDate(d) {
      return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T070000';
    }
    function toICSEndDate(d) {
      return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T080000';
    }

    plan.weeks.forEach(function(week) {
      var weekStart = new Date(startDate.getTime() + (week.weekNumber - 1) * 7 * 86400000);
      week.workouts.forEach(function(w) {
        if (w.type === 'rest') return;
        var eventDate = new Date(weekStart.getTime() + w.dayOfWeek * 86400000);
        var uid = 'stride-w' + week.weekNumber + '-d' + w.dayOfWeek + '@stride';

        var summary = w.type.charAt(0).toUpperCase() + w.type.slice(1) + ' run';
        if (w.targetDistance) summary += ' (' + w.targetDistance + ' mi)';
        else if (w.targetDuration) summary += ' (' + w.targetDuration + ' min)';

        var description = 'Week ' + week.weekNumber + ' - ' + week.phase + '\\n';
        if (w.notes) description += w.notes + '\\n';
        if (w.targetDistance) description += 'Target: ' + w.targetDistance + ' mi';
        else if (w.targetDuration) description += 'Target: ' + w.targetDuration + ' min';

        ics.push('BEGIN:VEVENT');
        ics.push('UID:' + uid);
        ics.push('DTSTART:' + toICSDate(eventDate));
        ics.push('DTEND:' + toICSEndDate(eventDate));
        ics.push('SUMMARY:' + summary);
        ics.push('DESCRIPTION:' + description);
        ics.push('END:VEVENT');
      });
    });

    ics.push('END:VCALENDAR');

    var blob = new Blob([ics.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'stride-roadmap.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderPlan(plan) {
    container.innerHTML = "";

    // Warnings
    if (plan.warnings && plan.warnings.length > 0) {
      var warnDiv = h("div", { style: "margin-bottom:24px;" });
      plan.warnings.forEach(function(w) {
        var banner = h("div", { className: "card-dark", style: "border-left:4px solid var(--violet);padding:14px 20px;margin-bottom:8px;" });
        banner.appendChild(h("p", { className: "text-sm", style: "color:var(--violet);", text: w }));
        warnDiv.appendChild(banner);
      });
      container.appendChild(warnDiv);
    }

    var summary = h("div", { className: "card-dark md:p-8" });
    var titleText = plan.totalWeeks > 0 ? "Your " + plan.totalWeeks + "-week roadmap" : "Your roadmap";
    summary.appendChild(h("h1", { className: "font-display text-3xl md:text-4xl", text: titleText }));

    if (plan.isElite) {
      var eliteBadge = h("span", { className: "text-xs font-semibold", style: "background:rgba(200,255,0,0.12);color:var(--lime-text);border:1px solid rgba(200,255,0,0.25);border-radius:var(--radius);padding:4px 12px;margin-left:12px;", text: "Elite tier" });
      titleText && summary.appendChild(eliteBadge);
    }

    var stats = h("div", { className: "mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4" });
    stats.appendChild(statBox("Path", plan.segment.replace(/_/g, " ")));
    stats.appendChild(statBox("Weekly mileage", plan.weeklyMileage + " mi"));
    stats.appendChild(statBox("Goal race", plan.goalDistance));
    stats.appendChild(statBox("Race date", plan.goalRaceDate || "TBD"));
    summary.appendChild(stats);

    // Action buttons
    var actions = h("div", { className: "plan-actions" });
    var downloadBtn = h("button", { className: "btn btn-primary", text: "Download your plan", style: "padding:12px 24px;", onclick: downloadPDF });
    var calBtn = h("button", { className: "btn btn-outline", text: "Sync to calendar", style: "padding:12px 24px;", onclick: downloadICS });
    actions.appendChild(downloadBtn);
    actions.appendChild(calBtn);
    summary.appendChild(actions);
    container.appendChild(summary);

    // Empty plan state
    if (!plan.weeks || plan.weeks.length === 0) {
      var emptyDiv = h("div", { className: "mt-10 text-center", style: "padding:60px 0;" });
      emptyDiv.appendChild(h("p", { className: "text-muted", text: "We couldn't build a plan with the information provided. Try adjusting your inputs." }));
      emptyDiv.appendChild(h("a", { className: "btn btn-primary mt-6", href: "/", text: "Start over" }));
      container.appendChild(emptyDiv);
      return;
    }

    // Pace targets
    var paceSection = h("div", { className: "mt-10" });
    paceSection.appendChild(h("h2", { className: "font-display text-2xl", text: "Pace targets" }));
    var table = h("table", { className: "mt-4 pace-table" });
    table.style.overflow = "hidden";
    table.style.border = "1px solid var(--border)";
    table.style.borderRadius = "6px";
    var thead = h("thead", {});
    thead.innerHTML = '<tr class="card-dark"><th style="padding:12px 16px;text-align:left;">Training pace</th><th style="padding:12px 16px;text-align:left;">Per mile</th><th style="padding:12px 16px;text-align:left;">Feel</th></tr>';
    table.appendChild(thead);
    var tbody = h("tbody", {});
    tbody.appendChild(paceRow("Easy", plan.paces.easySecsPerMi, "Conversational — can talk in full sentences"));
    tbody.appendChild(paceRow("Tempo", plan.paces.tempoSecsPerMi, "Comfortably hard — could hold for an hour"));
    tbody.appendChild(paceRow("Threshold", plan.paces.thresholdSecsPerMi, "Controlled but fast — lactate threshold"));
    tbody.appendChild(paceRow("Long run", plan.paces.longRunSecsPerMi, "Steady — finish feeling strong"));
    tbody.appendChild(paceRow("Race goal", plan.paces.raceGoalSecsPerMi, "Predicted finish: " + formatDuration(plan.paces.predictedFinishTimeSecs), true));
    table.appendChild(tbody);
    paceSection.appendChild(table);
    container.appendChild(paceSection);

    // Phase summary
    var phaseSection = h("div", { className: "mt-10" });
    phaseSection.appendChild(h("h2", { className: "font-display text-2xl", text: "Training phases" }));
    var phaseGrid = h("div", { className: "mt-4 grid gap-3 sm:grid-cols-4" });
    ["base","build","peak","taper"].forEach(function(phase) {
      var pw = plan.weeks.filter(function(w) { return w.phase === phase; });
      if (pw.length === 0) return;
      var card = h("div", { className: "card-dark " + getPhaseBg(phase) });
      card.appendChild(h("span", { className: "text-sm font-semibold " + getPhaseColor(phase), text: phase }));
      card.appendChild(h("span", { className: "mt-1 block text-xs text-muted", text: "Weeks " + pw[0].weekNumber + "\u2013" + pw[pw.length-1].weekNumber }));
      phaseGrid.appendChild(card);
    });
    phaseSection.appendChild(phaseGrid);
    container.appendChild(phaseSection);

    // Week by week
    var wbwSection = h("div", { className: "mt-10" });
    wbwSection.appendChild(h("h2", { className: "font-display text-2xl", text: "Week by week" }));
    var weekGrid = h("div", { className: "mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-4" });
    plan.weeks.forEach(function(week) {
      var card = h("div", { className: "card-dark " + getPhaseBg(week.phase) });
      var header = h("div", { className: "flex items-center justify-between", style: { cursor: "pointer" }, "aria-expanded": "false" });
      var left = h("div", {});
      left.appendChild(h("span", { className: "text-xs font-semibold " + getPhaseColor(week.phase), text: week.phase }));
      left.appendChild(h("span", { className: "mt-1 block font-display text-lg", text: "Week " + week.weekNumber }));
      header.appendChild(left);
      var right = h("div", { className: "flex items-center gap-2" });
      right.appendChild(h("span", { className: "text-sm text-muted", text: week.totalMileage + " mi" }));
      var chev = h("span", { className: "text-sm text-muted", text: "▸", style: { transition: "transform 0.2s" } });
      right.appendChild(chev);
      header.appendChild(right);

      var detailId = "w-" + week.weekNumber;
      var detail = h("div", { id: detailId, style: { borderTop: "1px solid var(--border)", paddingTop: "12px", marginTop: "12px" } });

      week.workouts.forEach(function(w) {
        var cls = getWorkoutClass(w.type);
        var wc = h("div", { className: "workout-card " + cls, style: { marginBottom: "4px" } });
        wc.appendChild(h("span", { className: "day", text: DAY_LABELS[w.dayOfWeek] }));
        wc.appendChild(h("span", { className: "type", text: w.type }));
        if (w.targetDistance) wc.appendChild(h("span", { text: w.targetDistance + " mi", style: { fontSize: "11px" } }));
        else if (w.targetDuration) wc.appendChild(h("span", { text: w.targetDuration + " min", style: { fontSize: "11px" } }));
        detail.appendChild(wc);
      });

      header.onclick = function() {
        var d = document.getElementById(detailId);
        var expanded = d.style.display !== "none";
        d.style.display = expanded ? "none" : "block";
        header.setAttribute("aria-expanded", expanded ? "false" : "true");
        chev.textContent = expanded ? "▸" : "▾";
      };
      detail.style.display = "none";

      card.appendChild(header);
      card.appendChild(detail);
      weekGrid.appendChild(card);
    });
    wbwSection.appendChild(weekGrid);
    container.appendChild(wbwSection);

    var note = h("p", { className: "mt-12 text-center text-xs text-muted", text: "This roadmap is tailored to your inputs. Come back as your fitness changes to rebuild it." });
    container.appendChild(note);
  }

  // Fallback: if JS failed to load for community, show plain HTML
  window.addEventListener("error", function(e) {
    if (e.target === window) {
      container.innerHTML = '<div style="text-align:center;padding:80px 0;"><p class="text-muted">Something went wrong. <a href="/" style="color:var(--cobalt);text-decoration:underline;">Go back</a> to try again.</p></div>';
    }
  });
})();
</script>

<script>
(function() {
  if (localStorage.getItem('cookieConsent') === 'true') return;
  var banner = document.createElement('div');
  banner.id = 'cookie-banner';
  banner.innerHTML = '<div style="position:fixed;bottom:0;left:0;right:0;background:var(--surface-1);border-top:1px solid var(--border-visible);padding:16px 24px;z-index:9999;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,0.06);"><p style="font-size:13px;color:var(--text-muted);margin:0;flex:1;min-width:200px;">Stride uses cookies for core functionality, analytics, and affiliate links. See our <a href="/cookies" style="color:var(--cobalt);text-decoration:underline;">Cookie Policy</a> for details.</p><div style="display:flex;gap:8px;flex-shrink:0;"><button id="cookie-accept" class="btn btn-primary" style="padding:10px 20px;font-size:13px;">Accept all</button><a href="/cookies" class="btn btn-secondary" style="padding:10px 20px;font-size:13px;">Cookie settings</a></div></div>';
  document.body.appendChild(banner);
  document.getElementById('cookie-accept').addEventListener('click', function() {
    localStorage.setItem('cookieConsent', 'true');
    document.getElementById('cookie-banner').remove();
  });
})();
</script>

</body>
</html>
