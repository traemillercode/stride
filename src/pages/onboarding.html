<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stride — Build your roadmap</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="site-logo">Stride</a>
  </div>
</header>

<main>
<div class="container-sm py-12" id="app">
  <a href="/" class="text-sm text-cobalt" style="text-decoration:underline;">← Back to Stride</a>
  <div class="mt-4" id="onboarding-content"></div>
</div>
</main>

<footer class="site-footer">
  <p>Stride — Built for every runner</p>
</footer>

<script src="/static/pacing.js"></script>
<script src="/static/planBuilder.js"></script>
<script>
(function() {
  var SEGMENTS = {
    "first-timer": { label: "Your first race", desc: "Never raced before? This plan builds from the ground up.", icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h3c1 0 3-2 3-4V8c0-1 .6-2 1.5-2.5L14 3"/><path d="M14 3l2 2M14 3l-1 4"/><path d="M18 12h2l1 3-2 4h-3l-2-6"/><path d="M5 20v-2"/><circle cx="20" cy="17" r="1.5"/></svg>' },
    "returner": { label: "Coming back", desc: "Welcome back. We'll meet your body where it is right now.", icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>' },
    "competitive": { label: "Chasing a PR", desc: "You've raced before and you're ready to go faster.", icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M12 5V3"/><path d="M9 2h6"/><path d="M4.22 5.22l1.42 1.42"/><path d="M18.36 6.64l1.42-1.42"/></svg>' },
    "trail": { label: "On the trails", desc: "Dirt, elevation, and distance — built for the trail runner.", icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l6-10 5 5 4-8 5 4"/><path d="M8 12l4-8"/></svg>' },
  };

  var path = window.location.pathname;
  var segSlug = path.split("/").pop() || "first-timer";
  var segment = SEGMENTS[segSlug] || SEGMENTS["first-timer"];
  var segKey = segSlug.replace("-", "_").toUpperCase();

  var state = {
    step: 1,
    totalSteps: 3,
    weeklyMileage: 10,
    goalDistance: "Half Marathon",
    goalRaceDate: "",
    hasRunBefore: null,
    motivation: "",
    timeOff: "",
    comingFromInjury: null,
    injuryDescription: "",
    previousRoutine: "",
    currentPR: { hours: "", minutes: "", seconds: "" },
    currentPRDistance: "",
    goalTime: { hours: "", minutes: "", seconds: "" },
    trainingDays: "5",
    trailType: "Mix",
    elevationGain: "",
    ultraDistance: null,
    yearsRunning: "",
    // New onboarding depth fields
    availableDays: [],
    restDay: "Sunday",
    longRunDay: "Weekend",
    knowsEasyRunPace: null,
    easyRunPace: "",
    priorExperience: "",
    hasRacedBefore: null,
    priorRaceTime: { hours: "", minutes: "", seconds: "" },
    priorRaceDistance: "",
    recentBestDistance: "",
    recentBestTime: { hours: "", minutes: "", seconds: "" },
    longestTrail: "",
  };

  var DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  var DAY_MAP = { "Monday": 0, "Tuesday": 1, "Wednesday": 2, "Thursday": 3, "Friday": 4, "Saturday": 5, "Sunday": 6 };

  var DISTANCES = ["5K", "10K", "Half Marathon", "Marathon", "Ultra"];
  var TRAIL_TYPES = ["Fire roads", "Single track", "Technical", "Mix"];

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === "className") el.className = attrs[k];
        else if (k === "style") { for (var sk in attrs[k]) el.style[sk] = attrs[k][sk]; }
        else if (k === "onclick") el.onclick = attrs[k];
        else if (k === "onchange") el.onchange = attrs[k];
        else if (k === "oninput") el.oninput = attrs[k];
        else if (k === "type") el.setAttribute("type", attrs[k]);
        else if (k === "value") el.value = attrs[k];
        else if (k === "placeholder") el.setAttribute("placeholder", attrs[k]);
        else if (k === "rows") el.setAttribute("rows", attrs[k]);
        else if (k === "min") el.setAttribute("min", attrs[k]);
        else if (k === "max") el.setAttribute("max", attrs[k]);
        else if (k === "html") el.innerHTML = attrs[k];
        else if (k === "text") el.textContent = attrs[k];
        else if (k === "href") el.setAttribute("href", attrs[k]);
        else el.setAttribute(k, attrs[k]);
      }
    }
    if (children) {
      if (typeof children === "string") el.textContent = children;
      else if (Array.isArray(children)) children.forEach(function(c) { if (c) el.appendChild(c); });
      else el.appendChild(children);
    }
    return el;
  }

  function toggleBtnGroup(container, options, current, onclick) {
    options.forEach(function(opt) {
      var isActive = current === opt;
      var btn = h("button", {
        type: "button",
        className: "btn " + (isActive ? "btn-primary" : "btn-secondary"),
        style: { fontSize: "13px", padding: "10px 16px" },
        onclick: function() { onclick(opt); },
        text: opt,
      });
      container.appendChild(btn);
    });
  }

  function toggleYesNo(container, current, onclick) {
    [true, false].forEach(function(val) {
      var label = val ? "Yes" : "No";
      var isActive = current === val;
      var btn = h("button", {
        type: "button",
        className: "btn " + (isActive ? "btn-primary" : "btn-secondary"),
        style: { fontSize: "13px", padding: "10px 20px" },
        onclick: function() { onclick(val); },
        text: label,
      });
      container.appendChild(btn);
    });
  }

  function dayToggleGroup(container, selectedDays, onchange) {
    DAYS.forEach(function(day) {
      var isActive = selectedDays.indexOf(day) !== -1;
      var btn = h("button", {
        type: "button",
        className: "btn " + (isActive ? "btn-primary" : "btn-secondary"),
        style: { fontSize: "12px", padding: "10px 12px", minWidth: "44px", borderRadius: "4px" },
        onclick: function() {
          var idx = state.availableDays.indexOf(day);
          if (idx === -1) {
            state.availableDays.push(day);
          } else {
            state.availableDays.splice(idx, 1);
          }
          onchange();
        },
        text: day.slice(0, 3),
      });
      container.appendChild(btn);
    });
  }

  function fieldGroup(label) {
    var div = h("div", { className: "mb-6" });
    var lbl = h("label", { text: label });
    div.appendChild(lbl);
    return div;
  }

  function timeInput(value, onChange) {
    var input = h("input", {
      type: "text", value: value || "",
      style: { width: "60px", textAlign: "center", padding: "12px 8px", fontSize: "16px" },
      placeholder: "00",
      oninput: function(e) {
        var v = e.target.value.replace(/\D/g, "").slice(0, 2);
        e.target.value = v;
        onChange(v);
      },
    });
    return input;
  }

  function render() {
    var container = document.getElementById("onboarding-content");
    container.innerHTML = "";

    // Header
    var header = h("div", {});
    var badge = h("span", { className: "text-xs font-semibold text-cobalt", style: { border: "1px solid rgba(30,94,245,0.3)", borderRadius: "6px", padding: "4px 12px", background: "rgba(30,94,245,0.1)" }, text: segment.label });
    var stepInfo = h("span", { className: "text-sm text-muted", text: "Step " + state.step + " of " + state.totalSteps, style: { marginLeft: "12px" } });
    header.appendChild(badge);
    header.appendChild(stepInfo);
    container.appendChild(header);

    var title = h("h1", { className: "mt-4 font-display text-3xl md:text-4xl", text: segment.label });
    var desc = h("p", { className: "mt-2 text-muted", text: segment.desc });
    container.appendChild(title);
    container.appendChild(desc);

    // Progress bar
    var pb = h("div", { className: "mt-6 progress-bar" });
    for (var i = 0; i < state.totalSteps; i++) {
      pb.appendChild(h("div", { className: "segment" + (i < state.step ? " active" : "") }));
    }
    container.appendChild(pb);

    var form = h("form", { onsubmit: function(e) { e.preventDefault(); handleSubmit(); } });
    form.style.marginTop = "32px";

    if (state.step === 1) {
      // Weekly mileage
      var g1 = fieldGroup("Current weekly mileage");
      var rangeRow = h("div", { className: "flex items-center gap-4" });
      var slider = h("input", { type: "range", min: "0", max: "200", value: String(state.weeklyMileage), style: { flex: "1" },
        oninput: function(e) { state.weeklyMileage = parseInt(e.target.value); render(); } });
      var val = h("span", { className: "font-display text-2xl text-cobalt", text: String(state.weeklyMileage), style: { minWidth: "60px", textAlign: "right", fontWeight: "700" } });
      rangeRow.appendChild(slider); rangeRow.appendChild(val);
      g1.appendChild(rangeRow);
      g1.appendChild(h("p", { className: "text-xs text-muted mt-1", text: "miles per week" }));
      if (state.weeklyMileage > 150) {
        g1.appendChild(h("p", { className: "text-sm mt-2", style: "color:var(--violet);", text: "That's a big week — just confirming that's accurate" }));
      }
      form.appendChild(g1);

      // Goal distance
      var g2 = fieldGroup("Goal race distance");
      var distGrid = h("div", { className: "grid grid-cols-3 sm:grid-cols-5 gap-2" });
      toggleBtnGroup(distGrid, DISTANCES, state.goalDistance, function(d) { state.goalDistance = d; render(); });
      g2.appendChild(distGrid);
      form.appendChild(g2);

      // Race date
      var g3 = fieldGroup("Goal race date");
      g3.appendChild(h("input", { type: "date", value: state.goalRaceDate, oninput: function(e) { state.goalRaceDate = e.target.value; render(); } }));
      if (state.goalRaceDate) {
        var rd = new Date(state.goalRaceDate + "T00:00:00");
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        if (rd < today) {
          g3.appendChild(h("p", { className: "text-sm mt-2", style: "color:var(--magenta);", text: "This date is in the past. Training plans work best with a future race date." }));
        }
      }
      form.appendChild(g3);

      // ── Weekly availability (all segments) ──
      var g4 = fieldGroup("Which days can you run?");
      g4.appendChild(h("p", { className: "text-xs text-muted mb-2", text: "Select at least three days" }));
      var dayGrid = h("div", { className: "flex flex-wrap gap-2" });
      dayToggleGroup(dayGrid, state.availableDays, function() { render(); });
      g4.appendChild(dayGrid);
      if (state.availableDays.length > 0 && state.availableDays.length < 3) {
        g4.appendChild(h("p", { className: "text-sm mt-2", style: "color:var(--magenta);", text: "Pick at least three days to build a sustainable plan." }));
      }
      form.appendChild(g4);

      var g5 = fieldGroup("Preferred rest day");
      var restSel = h("select", { onchange: function(e) { state.restDay = e.target.value; render(); } });
      DAYS.forEach(function(d) {
        restSel.appendChild(h("option", { value: d, text: d }));
      });
      restSel.value = state.restDay;
      g5.appendChild(restSel);
      form.appendChild(g5);

      var g6 = fieldGroup("Long run preference");
      var lrGrid = h("div", { className: "flex gap-3" });
      ["Weekend", "Weekday"].forEach(function(opt) {
        var isActive = state.longRunDay === opt;
        var btn = h("button", {
          type: "button",
          className: "btn " + (isActive ? "btn-primary" : "btn-secondary"),
          style: { fontSize: "13px", padding: "10px 20px" },
          onclick: function() { state.longRunDay = opt; render(); },
          text: opt,
        });
        lrGrid.appendChild(btn);
      });
      g6.appendChild(lrGrid);
      form.appendChild(g6);

      // ── Easy-run pace (all segments) ──
      var g7 = fieldGroup("Do you know your easy run pace?");
      var erpBtns = h("div", { className: "flex gap-3" });
      toggleYesNo(erpBtns, state.knowsEasyRunPace, function(v) { state.knowsEasyRunPace = v; if (!v) state.easyRunPace = ""; render(); });
      g7.appendChild(erpBtns);
      if (state.knowsEasyRunPace) {
        var erpRow = h("div", { className: "flex items-center gap-2 mt-2" });
        erpRow.appendChild(h("input", {
          type: "text", value: state.easyRunPace, placeholder: "e.g. 10:30",
          style: { width: "140px", textAlign: "center" },
          oninput: function(e) { state.easyRunPace = e.target.value; },
        }));
        erpRow.appendChild(h("span", { className: "text-sm text-muted", text: "minutes per mile" }));
        g7.appendChild(erpRow);
      } else if (state.knowsEasyRunPace === false) {
        g7.appendChild(h("p", { className: "text-sm mt-2", style: "color:var(--text-muted);", text: "A conversational pace \u2014 you could hold a full conversation while running. We\u2019ll calibrate this once you connect a watch." }));
      }
      form.appendChild(g7);
      }

      if (state.step === 2) {
      if (segSlug === "first-timer") {
        var g = fieldGroup("Have you done any running before?");
        var btns = h("div", { className: "flex gap-3" });
        toggleYesNo(btns, state.hasRunBefore, function(v) { state.hasRunBefore = v; render(); });
        g.appendChild(btns);
        form.appendChild(g);
        if (state.hasRunBefore) {
          var g2 = fieldGroup("What's motivating you to start?");
          g2.appendChild(h("textarea", { rows: "3", placeholder: "Optional — tell us what's driving you.", oninput: function(e) { state.motivation = e.target.value; } }));
          form.appendChild(g2);

          var g2b = fieldGroup("How much running have you done?");
          g2b.appendChild(h("textarea", { rows: "2", placeholder: "e.g. A few 5K run/walks, Couch to 5K week 4", oninput: function(e) { state.priorExperience = e.target.value; } }));
          form.appendChild(g2b);
        }
      }
      if (segSlug === "returner") {
        var g1 = fieldGroup("How long has it been since you ran regularly?");
        var sel = h("select", { onchange: function(e) { state.timeOff = e.target.value; render(); } });
        ["", "A few weeks", "A few months", "About a year", "More than a year"].forEach(function(o) {
          sel.appendChild(h("option", { value: o === "" ? "" : o, text: o === "" ? "Select..." : o }));
        });
        sel.value = state.timeOff;
        g1.appendChild(sel);
        form.appendChild(g1);

        var g2 = fieldGroup("Are you coming back from an injury?");
        var btns2 = h("div", { className: "flex gap-3" });
        toggleYesNo(btns2, state.comingFromInjury, function(v) { state.comingFromInjury = v; render(); });
        g2.appendChild(btns2);
        form.appendChild(g2);
        if (state.comingFromInjury) {
          var g3 = fieldGroup("Describe the injury");
          g3.appendChild(h("textarea", { rows: "3", placeholder: "What happened and how has recovery been?", oninput: function(e) { state.injuryDescription = e.target.value; } }));
          form.appendChild(g3);
        }

        var g4 = fieldGroup("What was your routine before the break?");
        g4.appendChild(h("textarea", { rows: "3", placeholder: "Optional — distances, frequency, paces...", oninput: function(e) { state.previousRoutine = e.target.value; } }));
        form.appendChild(g4);

        // ── Prior race experience (returner-specific) ──
        var g5r = fieldGroup("Have you raced this distance before?");
        var g5rBtns = h("div", { className: "flex gap-3" });
        toggleYesNo(g5rBtns, state.hasRacedBefore, function(v) { state.hasRacedBefore = v; if (!v) { state.priorRaceTime = { hours: "", minutes: "", seconds: "" }; state.priorRaceDistance = ""; } render(); });
        g5r.appendChild(g5rBtns);
        form.appendChild(g5r);
        if (state.hasRacedBefore) {
          var g5s = fieldGroup("What was your time? (hr : min : sec)");
          var g5sRow = h("div", { className: "flex items-center gap-2" });
          g5sRow.appendChild(timeInput(state.priorRaceTime.hours, function(v) { state.priorRaceTime.hours = v; }));
          g5sRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
          g5sRow.appendChild(timeInput(state.priorRaceTime.minutes, function(v) { state.priorRaceTime.minutes = v; }));
          g5sRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
          g5sRow.appendChild(timeInput(state.priorRaceTime.seconds, function(v) { state.priorRaceTime.seconds = v; }));
          g5s.appendChild(g5sRow);
          form.appendChild(g5s);
        }
        }
      if (segSlug === "competitive") {
        var g1 = fieldGroup("Recent race distance");
        var distGrid = h("div", { className: "grid grid-cols-3 sm:grid-cols-5 gap-2" });
        toggleBtnGroup(distGrid, DISTANCES, state.currentPRDistance || state.goalDistance, function(d) { state.currentPRDistance = d; render(); });
        g1.appendChild(distGrid);
        form.appendChild(g1);

        var g2 = fieldGroup("Your recent race time (hr : min : sec)");
        var row1 = h("div", { className: "flex items-center gap-2" });
        row1.appendChild(timeInput(state.currentPR.hours, function(v) { state.currentPR.hours = v; }));
        row1.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
        row1.appendChild(timeInput(state.currentPR.minutes, function(v) { state.currentPR.minutes = v; }));
        row1.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
        row1.appendChild(timeInput(state.currentPR.seconds, function(v) { state.currentPR.seconds = v; }));
        g2.appendChild(row1);
        form.appendChild(g2);

        var g3 = fieldGroup("How many days per week are you training now?");
        var grid = h("div", { className: "grid grid-cols-6 gap-2" });
        toggleBtnGroup(grid, ["2","3","4","5","6","7"], state.trainingDays, function(d) { state.trainingDays = d; render(); });
        g3.appendChild(grid);
        form.appendChild(g3);

        var g4 = fieldGroup("Years running");
        var yrRow = h("div", { className: "flex items-center gap-4" });
        yrRow.appendChild(h("input", { type: "number", min: "0", max: "60", value: state.yearsRunning, placeholder: "e.g. 3", style: { width: "120px" }, oninput: function(e) { state.yearsRunning = e.target.value; } }));
        yrRow.appendChild(h("span", { className: "text-sm text-muted", text: "years" }));
        g4.appendChild(yrRow);
        form.appendChild(g4);

        // ── Goal time + recent best (competitive-specific) ──
        var g5c = fieldGroup("Your goal finish time (hr : min : sec)");
        var g5cRow = h("div", { className: "flex items-center gap-2" });
        g5cRow.appendChild(timeInput(state.goalTime.hours, function(v) { state.goalTime.hours = v; }));
        g5cRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
        g5cRow.appendChild(timeInput(state.goalTime.minutes, function(v) { state.goalTime.minutes = v; }));
        g5cRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
        g5cRow.appendChild(timeInput(state.goalTime.seconds, function(v) { state.goalTime.seconds = v; }));
        g5c.appendChild(g5cRow);
        form.appendChild(g5c);

        var g6c = fieldGroup("Your recent best at any distance");
        var g6cDistGrid = h("div", { className: "grid grid-cols-3 sm:grid-cols-5 gap-2" });
        toggleBtnGroup(g6cDistGrid, DISTANCES, state.recentBestDistance, function(d) { state.recentBestDistance = d; render(); });
        g6c.appendChild(g6cDistGrid);
        form.appendChild(g6c);
        if (state.recentBestDistance) {
          var g6cRow = h("div", { className: "flex items-center gap-2 mt-2" });
          g6cRow.appendChild(timeInput(state.recentBestTime.hours, function(v) { state.recentBestTime.hours = v; }));
          g6cRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
          g6cRow.appendChild(timeInput(state.recentBestTime.minutes, function(v) { state.recentBestTime.minutes = v; }));
          g6cRow.appendChild(h("span", { text: ":", style: { color: "var(--text-muted)" } }));
          g6cRow.appendChild(timeInput(state.recentBestTime.seconds, function(v) { state.recentBestTime.seconds = v; }));
          g6c.appendChild(g6cRow);
          g6c.appendChild(h("span", { className: "text-xs text-muted", text: "hr : min : sec" }));
        }
        }
      if (segSlug === "trail") {
        var g1 = fieldGroup("What type of trails do you run?");
        var grid = h("div", { className: "grid grid-cols-2 gap-3" });
        toggleBtnGroup(grid, TRAIL_TYPES, state.trailType, function(t) { state.trailType = t; render(); });
        g1.appendChild(grid);
        form.appendChild(g1);

        var g2 = fieldGroup("Typical elevation gain per week (feet)");
        g2.appendChild(h("input", { type: "number", min: "0", max: "30000", placeholder: "e.g. 2000", oninput: function(e) { state.elevationGain = e.target.value; } }));
        form.appendChild(g2);

        var g3 = fieldGroup("Planning on any ultra distances?");
        var btns3 = h("div", { className: "flex gap-3" });
        toggleYesNo(btns3, state.ultraDistance, function(v) { state.ultraDistance = v; render(); });
        g3.appendChild(btns3);
        form.appendChild(g3);

        // ── Prior trail experience (trail-specific) ──
        var g4t = fieldGroup("Longest trail run or race?");
        g4t.appendChild(h("textarea", { rows: "2", placeholder: "e.g. 15 miles, 3:45 at Big Basin", oninput: function(e) { state.longestTrail = e.target.value; } }));
        form.appendChild(g4t);
        }
    }

    if (state.step === 3) {
      var review = h("div", { className: "card-dark" });
      var rh3 = h("h3", { className: "font-display text-xl", text: "Review your profile" });
      review.appendChild(rh3);
      var dl = h("div", { className: "mt-4", style: { display: "flex", flexDirection: "column", gap: "12px" } });
      function rr(label, value) {
        var row = h("div", { style: { display: "flex", justifyContent: "space-between" } });
        row.appendChild(h("span", { className: "text-sm text-muted", text: label }));
        row.appendChild(h("span", { className: "text-sm font-semibold", text: value }));
        return row;
      }
      dl.appendChild(rr("Path", segment.label));
      dl.appendChild(rr("Weekly mileage", state.weeklyMileage + " miles"));
      dl.appendChild(rr("Goal distance", state.goalDistance));
      dl.appendChild(rr("Race date", state.goalRaceDate || "Not set"));
      if (state.availableDays.length) dl.appendChild(rr("Run days", state.availableDays.join(", ")));
      dl.appendChild(rr("Rest day", state.restDay));
      dl.appendChild(rr("Long run", state.longRunDay));
      if (state.knowsEasyRunPace === true && state.easyRunPace) dl.appendChild(rr("Easy pace", state.easyRunPace + " /mi"));
      if (segSlug === "first-timer" && state.hasRunBefore !== null) dl.appendChild(rr("Run before", state.hasRunBefore ? "Yes" : "No"));
      if (segSlug === "first-timer" && state.priorExperience) dl.appendChild(rr("Experience", state.priorExperience));
      if (segSlug === "returner" && state.timeOff) dl.appendChild(rr("Time off", state.timeOff));
      if (segSlug === "returner" && state.comingFromInjury !== null) dl.appendChild(rr("Coming from injury", state.comingFromInjury ? "Yes" : "No"));
      if (segSlug === "returner" && state.hasRacedBefore !== null) dl.appendChild(rr("Raced before", state.hasRacedBefore ? "Yes" : "No"));
      if (segSlug === "returner" && state.hasRacedBefore && (state.priorRaceTime.hours || state.priorRaceTime.minutes)) {
        var prt = (state.priorRaceTime.hours || "0") + ":" + (state.priorRaceTime.minutes || "00") + ":" + (state.priorRaceTime.seconds || "00");
        dl.appendChild(rr("Prior time", prt));
      }
      if (segSlug === "competitive" && (state.currentPR.hours || state.currentPR.minutes)) {
        dl.appendChild(rr("Recent race distance", state.currentPRDistance || state.goalDistance));
        var pr = (state.currentPR.hours || "0") + ":" + (state.currentPR.minutes || "00") + ":" + (state.currentPR.seconds || "00");
        dl.appendChild(rr("Recent race time", pr));
      }
      if (segSlug === "competitive" && (state.goalTime.hours || state.goalTime.minutes)) {
        var gt = (state.goalTime.hours || "0") + ":" + (state.goalTime.minutes || "00") + ":" + (state.goalTime.seconds || "00");
        dl.appendChild(rr("Goal time", gt));
      }
      if (segSlug === "competitive" && state.recentBestDistance) {
        dl.appendChild(rr("Recent best distance", state.recentBestDistance));
        if (state.recentBestTime.hours || state.recentBestTime.minutes) {
          var rbt = (state.recentBestTime.hours || "0") + ":" + (state.recentBestTime.minutes || "00") + ":" + (state.recentBestTime.seconds || "00");
          dl.appendChild(rr("Recent best time", rbt));
        }
      }
      if (segSlug === "competitive" && state.yearsRunning) dl.appendChild(rr("Years running", state.yearsRunning));
      if (segSlug === "trail") dl.appendChild(rr("Trail type", state.trailType));
      if (segSlug === "trail" && state.elevationGain) dl.appendChild(rr("Elevation gain", state.elevationGain + " ft"));
      if (segSlug === "trail" && state.longestTrail) dl.appendChild(rr("Longest trail", state.longestTrail));
      review.appendChild(dl);
      form.appendChild(review);
    }

    // Navigation buttons
    var nav = h("div", { style: { borderTop: "1px solid var(--border)", paddingTop: "24px", marginTop: "32px", display: "flex", justifyContent: "space-between" } });
    if (state.step > 1) {
      var back = h("button", { type: "button", className: "btn btn-secondary", text: "Back", onclick: function() { state.step--; render(); } });
      nav.appendChild(back);
    } else {
      nav.appendChild(h("div", {}));
    }
    if (state.step < state.totalSteps) {
      var next = h("button", { type: "button", className: "btn btn-primary", text: "Continue", onclick: function() {
        if (state.step === 1 && state.availableDays.length < 3) {
          render();
          return;
        }
        state.step++; render();
      } });
      nav.appendChild(next);
    } else {
      var submit = h("button", { type: "submit", className: "btn btn-primary", text: "Map my roadmap", style: { padding: "14px 32px" } });
      nav.appendChild(submit);
    }
    form.appendChild(nav);
    container.appendChild(form);
  }

  function handleSubmit() {
    var raceTimeSecs;
    if (state.currentPR.hours || state.currentPR.minutes || state.currentPR.seconds) {
      var hh = parseInt(state.currentPR.hours) || 0;
      var mm = parseInt(state.currentPR.minutes) || 0;
      var ss = parseInt(state.currentPR.seconds) || 0;
      raceTimeSecs = hh * 3600 + mm * 60 + ss;
    }

    var priorRaceTimeSecs;
    if (state.priorRaceTime.hours || state.priorRaceTime.minutes || state.priorRaceTime.seconds) {
      var ph = parseInt(state.priorRaceTime.hours) || 0;
      var pm = parseInt(state.priorRaceTime.minutes) || 0;
      var ps = parseInt(state.priorRaceTime.seconds) || 0;
      priorRaceTimeSecs = ph * 3600 + pm * 60 + ps;
    }

    var goalTimeSecs;
    if (state.goalTime.hours || state.goalTime.minutes || state.goalTime.seconds) {
      var gh = parseInt(state.goalTime.hours) || 0;
      var gm = parseInt(state.goalTime.minutes) || 0;
      var gs = parseInt(state.goalTime.seconds) || 0;
      goalTimeSecs = gh * 3600 + gm * 60 + gs;
    }

    var recentBestTimeSecs;
    if (state.recentBestTime.hours || state.recentBestTime.minutes || state.recentBestTime.seconds) {
      var rh = parseInt(state.recentBestTime.hours) || 0;
      var rm = parseInt(state.recentBestTime.minutes) || 0;
      var rs = parseInt(state.recentBestTime.seconds) || 0;
      recentBestTimeSecs = rh * 3600 + rm * 60 + rs;
    }

    // Parse easyRunPace "mm:ss" to seconds per mile
    var easyRunPaceSecs;
    if (state.easyRunPace) {
      var parts = state.easyRunPace.split(":");
      if (parts.length === 2) {
        easyRunPaceSecs = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
      }
    }

    var plan = buildPlan({
      segment: segKey,
      goalDistance: state.goalDistance,
      goalRaceDate: state.goalRaceDate,
      weeklyMileage: state.weeklyMileage,
      recentRaceTimeSecs: raceTimeSecs || undefined,
      recentRaceDistance: raceTimeSecs ? (state.currentPRDistance || state.goalDistance) : undefined,
      injuryHistory: segSlug === "returner" && state.comingFromInjury ? state.injuryDescription : undefined,
      elevationGain: state.elevationGain || undefined,
      // New onboarding depth options
      availableDays: state.availableDays,
      restDay: state.restDay,
      longRunDay: state.longRunDay,
      easyRunPaceSecs: easyRunPaceSecs || undefined,
      priorRaceTimeSecs: priorRaceTimeSecs || undefined,
      priorRaceDistance: priorRaceTimeSecs ? state.goalDistance : undefined,
      goalTimeSecs: goalTimeSecs || undefined,
      recentBestTimeSecs: recentBestTimeSecs || undefined,
      recentBestDistance: recentBestTimeSecs ? state.recentBestDistance : undefined,
      priorExperience: state.priorExperience || undefined,
      longestTrail: state.longestTrail || undefined,
    });

    var planId = Date.now().toString(36);
    sessionStorage.setItem("plan-" + planId, JSON.stringify(plan));
    window.location.href = "/plan/" + planId;
  }

  render();
})();
</script>

</body>
</html>
