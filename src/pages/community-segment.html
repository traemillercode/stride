<!--
  Data model extension for future database (Prisma schema):

  model CommunitySpace {
    id            String   @id @default(uuid())
    name          String
    slug          String   @unique
    type          String   // segment | circle | pace_band
    description   String?
    parentSpaceId String?  // for nesting circles under segments
    joinCode      String?  // for invite-based circles
    paceBandMin   Float?   // min pace in min/mi for pace_band spaces
    paceBandMax   Float?   // max pace in min/mi for pace_band spaces
    memberCount   Int      @default(0)
    createdAt     DateTime @default(now())
  }
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stride — Community Segment</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/brand-mark.svg" type="image/svg+xml">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="site-logo">Stride</a>
    <nav class="site-nav">
      <a href="/races" class="nav-link">Races</a>
      <a href="/resources" class="nav-link">Resources</a>
      <a href="/community" class="nav-active">Community</a>
      <a href="/onboarding/first-timer" class="btn btn-primary" style="padding:8px 16px;font-size:13px;">Map your roadmap</a>
    </nav>
  </div>
</header>

<main id="segment-app">
<div class="container py-12">
  <a href="/community" class="text-sm" style="color:var(--violet);text-decoration:underline;">← Back to community</a>
  <div id="segment-content" class="mt-6"></div>
</div>
</main>

<footer class="site-footer">
  <p>Stride — Built for every runner</p>
  <div class="links"><a href="/races" class="nav-link">Races</a><a href="/resources" class="nav-link">Resources</a><a href="/community">Community</a><span aria-hidden="true" style="color:var(--text-dim);margin:0 8px;">|</span><a href="/contact" class="nav-link">Contact</a>
    <a href="/privacy" class="nav-link">Privacy</a><a href="/terms" class="nav-link">Terms</a><a href="/cookies" class="nav-link">Cookies</a><a href="/dmca" class="nav-link">DMCA</a>
    <a href="/data-deletion" class="nav-link">Data deletion</a><a href="/health-disclosure" class="nav-link">Health disclosure</a><a href="/accessibility" class="nav-link">Accessibility</a></div>
</footer>

<script>
(function() {
  // ── Source SVG icons ──
  var SOURCE_ICONS = {
    garmin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10,2 22,12 10,22 10,14 2,14 2,10 10,10"/></svg>',
    strava: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,18 12,6 18,18"/><polyline points="9,14 12,10 15,14"/></svg>',
    coros: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 8V6"/><path d="M12 17v1"/><path d="M8 12H6"/><path d="M18 12h-2"/></svg>',
    apple_health: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 13.5c-.2 2.5-2.3 4.5-4.8 4.5-1.7 0-3-1-4-2-1 1-2.3 2-4 2-2.5 0-4.5-2-4.8-4.5-.1-1 .1-2 .6-2.7C5.5 8.5 9 6 12 6s6.5 2.5 8.2 4.8c.5.7.7 1.7.6 2.7z"/></svg>',
    manual: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  };

  var SOURCE_LABELS = {
    garmin: "via Garmin",
    strava: "via Strava",
    coros: "via Coros",
    apple_health: "via Apple Health",
    manual: "manual entry",
  };

  function fmtPace(secsPerMi) {
    var min = Math.floor(secsPerMi / 60);
    var sec = Math.round(secsPerMi % 60);
    return min + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function fmtDuration(totalSecs) {
    var h = Math.floor(totalSecs / 3600);
    var m = Math.floor((totalSecs % 3600) / 60);
    var s = Math.round(totalSecs % 60);
    if (h > 0) {
      return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function renderActivityCard(a) {
    var html = '';
    html += '<div class="card-dark" data-user="' + a.user + '" style="margin-bottom:8px;padding:16px;">';

    // Top row: user name + relative time
    html += '<div class="flex items-center justify-between">';
    html += '<span class="text-sm font-semibold">' + a.user + '</span>';
    html += '<span class="text-xs text-dim">' + a.time + '</span>';
    html += '</div>';

    // Stats row (if activity data exists)
    if (a.activity && (a.activity.distanceMi || a.activity.avgPaceSecsPerMi || a.activity.durationSecs)) {
      html += '<div class="activity-stats">';
      if (a.activity.distanceMi) {
        html += '<span class="activity-stat-distance">' + a.activity.distanceMi.toFixed(1) + ' mi</span>';
      }
      if (a.activity.avgPaceSecsPerMi) {
        html += '<span class="activity-stat-pace">' + fmtPace(a.activity.avgPaceSecsPerMi) + ' /mi</span>';
      }
      if (a.activity.durationSecs) {
        html += '<span class="activity-stat-duration">' + fmtDuration(a.activity.durationSecs) + '</span>';
      }
      html += '</div>';
    }

    // Narrative (if present)
    if (a.narrative) {
      html += '<p class="activity-narrative">' + a.narrative + '</p>';
    }

    // Bottom row: source badge + location
    html += '<div class="activity-meta">';
    if (a.source && a.source.platform) {
      var plat = a.source.platform;
      html += '<span class="source-badge src-' + plat + '">';
      html += (SOURCE_ICONS[plat] || SOURCE_ICONS.manual);
      html += (SOURCE_LABELS[plat] || "manual entry");
      html += '</span>';
    }
    if (a.isAutoPosted) {
      html += '<span class="auto-posted-label">auto-posted</span>';
    }
    if (a.location && a.location.city) {
      var loc = a.location.city + (a.location.state ? ", " + a.location.state : "");
      html += '<span class="activity-location">' + loc + '</span>';
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  var SEGMENTS = {
    "first-timer": {
      label: "Your first race",
      desc: "Never raced before? This is your space. Find training partners at your pace, share wins (no matter how small), and get advice from runners who remember what day one felt like.",
      icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h3c1 0 3-2 3-4V8c0-1 .6-2 1.5-2.5L14 3"/><path d="M14 3l2 2M14 3l-1 4"/><path d="M18 12h2l1 3-2 4h-3l-2-6"/><path d="M5 20v-2"/><circle cx="20" cy="17" r="1.5"/></svg>',
      accentColor: "var(--cobalt)",
      memberCount: "2.4K",
      recentActivity: [
        { user: "Jamie L.", activity: { type: "run", distanceMi: 3.1 }, source: { platform: "strava" }, location: { city: "Minneapolis", state: "MN" }, time: "2 hours ago", narrative: "completed their first 5K training run without stopping" },
        { user: "Reyna M.", activity: null, source: { platform: "manual" }, location: null, time: "5 hours ago", narrative: "asked about shin pain — got 8 responses from the community" },
        { user: "Coach Mike", activity: null, source: { platform: "manual" }, location: null, time: "8 hours ago", narrative: "posted: \u201CYour first race isn\u2019t about speed. It\u2019s about proving you can do hard things.\u201D" },
        { user: "Tanya W.", activity: null, source: { platform: "manual" }, location: null, time: "12 hours ago", narrative: "just joined the segment. Welcome them." },
      ]
    },
    "returner": {
      label: "Coming back",
      desc: "Welcome back. This space is for runners returning after time off, injury, or life getting in the way. No judgment — just support and smart training advice.",
      icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>',
      accentColor: "var(--violet)",
      memberCount: "1.8K",
      recentActivity: [
        { user: "Carlos R.", activity: { type: "run", distanceMi: 4.0, durationSecs: 2080, avgPaceSecsPerMi: 520 }, source: { platform: "garmin" }, location: { city: "San Diego", state: "CA" }, time: "1 hour ago", narrative: "logged his first pain-free 4-miler since the knee injury. 8 weeks of patience paying off." },
        { user: "Nia K.", activity: null, source: { platform: "manual" }, location: null, time: "4 hours ago", narrative: "asked: \u201CHow do you mentally handle being slower than you used to be?\u201D — 14 thoughtful replies" },
        { user: "Dr. Patel", activity: null, source: { platform: "manual" }, location: null, time: "6 hours ago", narrative: "posted a PT\u2019s guide to Achilles rehab for returning runners" },
        { user: "Sam T.", activity: null, source: { platform: "manual" }, location: null, time: "1 day ago", narrative: "just joined after 3 years off. Show them some love." },
      ]
    },
    "competitive": {
      label: "Chasing a PR",
      desc: "You've raced. You want to race faster. This space is for serious training talk — pace targets, periodization, fueling strategies, and race execution.",
      icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M12 5V3"/><path d="M9 2h6"/><path d="M4.22 5.22l1.42 1.42"/><path d="M18.36 6.64l1.42-1.42"/></svg>',
      accentColor: "var(--magenta)",
      memberCount: "3.1K",
      recentActivity: [
        { user: "Derek P.", activity: { type: "run", distanceMi: 26.2, durationSecs: 10680, avgPaceSecsPerMi: 408 }, source: { platform: "strava" }, location: { city: "Chicago", state: "IL" }, time: "3 hours ago", narrative: "race report: 2:58 marathon — a 12-minute PR at Chicago" },
        { user: "Anna V.", activity: null, source: { platform: "manual" }, location: null, time: "6 hours ago", narrative: "shared custom workout: 3×2mi at threshold with 90s recovery. \u201CThis one humbled me.\u201D" },
        { user: "Coach Elena", activity: null, source: { platform: "manual" }, location: null, time: "10 hours ago", narrative: "dropped a guide on carb periodization for marathon builds" },
        { user: "Marcus J.", activity: null, source: { platform: "manual" }, location: null, time: "14 hours ago", narrative: "asked: \u201CWhat\u2019s your go-to pre-race breakfast 3 hours out?\u201D — 27 replies" },
      ]
    },
    "trail": {
      label: "On the trails",
      desc: "Dirt, vert, and distance. This space is for trail runners — from fire-road first-timers to ultra veterans. Training that accounts for elevation, terrain, and the sheer joy of being out there.",
      icon: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l6-10 5 5 4-8 5 4"/><path d="M8 12l4-8"/></svg>',
      accentColor: "var(--lime)",
      memberCount: "1.2K",
      recentActivity: [
        { user: "River K.", activity: { type: "run", distanceMi: 22.0 }, source: { platform: "coros" }, location: { city: "Bend", state: "OR" }, time: "2 hours ago", narrative: "logged a 22-mile training run with 4,800ft of vert on the PCT" },
        { user: "Jenna M.", activity: null, source: { platform: "manual" }, location: null, time: "5 hours ago", narrative: "asked: \u201CBest trail shoes for wet rock in the PNW?\u201D — 11 gear recs" },
        { user: "TrailDad", activity: null, source: { platform: "manual" }, location: null, time: "9 hours ago", narrative: "posted a photo essay from the Leadville 100 training weekend" },
        { user: "Luca F.", activity: null, source: { platform: "manual" }, location: null, time: "16 hours ago", narrative: "just signed up for their first 50K. Drop them some encouragement." },
      ]
    },
  };

  var pathname = window.location.pathname;
  var slug = pathname.split("/").pop() || "first-timer";
  var segment = SEGMENTS[slug] || SEGMENTS["first-timer"];

  var container = document.getElementById("segment-content");

  var header = '<div class="flex items-start gap-6 flex-wrap" style="margin-bottom:32px;">';
  header += '<div style="width:64px;height:64px;border-radius:var(--radius);background:rgba(30,94,245,0.1);display:flex;align-items:center;justify-content:center;font-size:32px;color:' + segment.accentColor + ';">' + segment.icon + '</div>';
  header += '<div style="flex:1;min-width:260px;">';
  header += '<h1 class="font-display" style="font-size:40px;font-weight:900;letter-spacing:-0.03em;line-height:1.1;">' + segment.label + '</h1>';
  header += '<p class="text-lg text-muted mt-2 leading-relaxed">' + segment.desc + '</p>';
  header += '<div class="flex gap-6 mt-3 text-sm">';
  header += '<span style="color:' + segment.accentColor + ';font-weight:600;">' + segment.memberCount + ' members</span>';
  header += '<span class="text-muted">•</span>';
  header += '<span class="text-muted">Active daily</span>';
  header += '</div>';
  header += '<div class="mt-4">';
  header += '<button class="btn btn-primary" style="font-size:13px;padding:10px 20px;">Join this group</button>';
  header += '</div>';
  header += '</div></div>';
  container.innerHTML = header;

  // Pace spaces links
  var paceLinks = '<div class="card-dark mb-8">';
  paceLinks += '<h3 class="font-display text-lg font-bold" style="color:var(--violet);">Find runners at your pace</h3>';
  paceLinks += '<p class="text-sm text-muted mt-1 mb-4">Pace-based spaces where you can connect with runners at your effort level.</p>';
  paceLinks += '<div class="flex flex-wrap gap-3">';
  var paces = [
    { slug: "sub-7", label: "Sub-7:00 /mi" },
    { slug: "7-9", label: "7:00–9:00 /mi" },
    { slug: "9-11", label: "9:00–11:00 /mi" },
    { slug: "11-plus", label: "11:00+ /mi" },
  ];
  paces.forEach(function(p) {
    paceLinks += '<a href="/community/pace/' + p.slug + '" class="btn btn-secondary" style="font-size:12px;padding:8px 16px;">' + p.label + '</a>';
  });
  paceLinks += '</div></div>';
  container.innerHTML += paceLinks;

  // Recent activity
  var activity = '<div>';
  activity += '<h2 class="font-display text-2xl font-bold mb-4">Recent activity</h2>';
  if (segment.recentActivity && segment.recentActivity.length > 0) {
    segment.recentActivity.forEach(function(a) {
      activity += renderActivityCard(a);
    });
  } else {
    activity += '<div class="empty-state"><p class="text-muted">No runners here yet — be the first.</p><a href="/onboarding/first-timer" class="btn btn-primary mt-4" style="font-size:13px;">Map your roadmap</a></div>';
  }
  activity += '</div>';
  container.innerHTML += activity;
})();
</script>

<script>
(function() {
  if (localStorage.getItem('cookieConsent') === 'true') return;
  var banner = document.createElement('div');
  banner.id = 'cookie-banner';
  banner.innerHTML = '<div style="position:fixed;bottom:0;left:0;right:0;background:var(--surface-1);border-top:1px solid var(--border-visible);padding:16px 24px;z-index:9999;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,0.06);"><p style="font-size:13px;color:var(--text-muted);margin:0;flex:1;min-width:200px;">Stride uses cookies for core functionality, analytics, and affiliate links. See our <a href="/cookies" style="color:var(--cobalt);text-decoration:underline;">Cookie Policy</a> for details.</p><div style="display:flex;gap:8px;flex-shrink:0;"><button id="cookie-accept" class="btn btn-primary" style="padding:10px 20px;font-size:13px;">Accept all</button><a href="/cookies" class="btn btn-secondary" style="padding:10px 20px;font-size:13px;">Cookie settings</a></div></div>';
  document.body.appendChild(banner);
  document.getElementById('cookie-accept').addEventListener('click', function() {
    localStorage.setItem('cookieConsent', 'true');
    document.getElementById('cookie-banner').remove();
  });
})();
</script>

</body>
</html>
