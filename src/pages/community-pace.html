<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stride — Pace Space</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="site-logo">Stride</a>
    <nav class="site-nav">
      <a href="/races" class="nav-link">Races</a>
      <a href="/resources" class="nav-link">Resources</a>
      <a href="/community" class="nav-active">Community</a>
      <a href="/onboarding/first-timer" class="btn btn-primary" style="padding:8px 16px;font-size:13px;">Map your roadmap</a>
    </nav>
  </div>
</header>

<main id="pace-app">
<div class="container py-12">
  <a href="/community" class="text-sm" style="color:var(--violet);text-decoration:underline;">← Back to community</a>
  <div id="pace-content" class="mt-6"></div>
</div>
</main>

<footer class="site-footer">
  <p>Stride — Built for every runner</p>
  <div class="links"><a href="/races" class="nav-link">Races</a><a href="/resources" class="nav-link">Resources</a><a href="/community">Community</a><span aria-hidden="true" style="color:var(--text-dim);margin:0 8px;">|</span><a href="/contact" class="nav-link">Contact</a>
    <a href="/privacy" class="nav-link">Privacy</a><a href="/terms" class="nav-link">Terms</a><a href="/cookies" class="nav-link">Cookies</a><a href="/dmca" class="nav-link">DMCA</a>
    <a href="/data-deletion" class="nav-link">Data deletion</a><a href="/health-disclosure" class="nav-link">Health disclosure</a><a href="/accessibility" class="nav-link">Accessibility</a></div>
</footer>

<script src="/static/moderation.js"></script>
<script>
(function() {
  // ── Source SVG icons ──
  var SOURCE_ICONS = {
    garmin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10,2 22,12 10,22 10,14 2,14 2,10 10,10"/></svg>',
    strava: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,18 12,6 18,18"/><polyline points="9,14 12,10 15,14"/></svg>',
    coros: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 8V6"/><path d="M12 17v1"/><path d="M8 12H6"/><path d="M18 12h-2"/></svg>',
    apple_health: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 13.5c-.2 2.5-2.3 4.5-4.8 4.5-1.7 0-3-1-4-2-1 1-2.3 2-4 2-2.5 0-4.5-2-4.8-4.5-.1-1 .1-2 .6-2.7C5.5 8.5 9 6 12 6s6.5 2.5 8.2 4.8c.5.7.7 1.7.6 2.7z"/></svg>',
    manual: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  };

  var SOURCE_LABELS = {
    garmin: "via Garmin",
    strava: "via Strava",
    coros: "via Coros",
    apple_health: "via Apple Health",
    manual: "manual entry",
  };

  // ── Format helpers ──
  function fmtPace(secsPerMi) {
    var min = Math.floor(secsPerMi / 60);
    var sec = Math.round(secsPerMi % 60);
    return min + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function fmtDuration(totalSecs) {
    var h = Math.floor(totalSecs / 3600);
    var m = Math.floor((totalSecs % 3600) / 60);
    var s = Math.round(totalSecs % 60);
    if (h > 0) {
      return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // ── Activity card renderer ──
  function renderActivityCard(a) {
    var html = '';
    html += '<div class="card-dark" data-user="' + a.user + '" style="margin-bottom:8px;padding:16px;">';

    // Top row: user name + relative time
    html += '<div class="flex items-center justify-between">';
    html += '<span class="text-sm font-semibold">' + a.user + '</span>';
    html += '<span class="text-xs text-dim">' + a.time + '</span>';
    html += '</div>';

    // Stats row (if activity data exists)
    if (a.activity && (a.activity.distanceMi || a.activity.avgPaceSecsPerMi || a.activity.durationSecs)) {
      html += '<div class="activity-stats">';
      if (a.activity.distanceMi) {
        html += '<span class="activity-stat-distance">' + a.activity.distanceMi.toFixed(1) + ' mi</span>';
      }
      if (a.activity.avgPaceSecsPerMi) {
        html += '<span class="activity-stat-pace">' + fmtPace(a.activity.avgPaceSecsPerMi) + ' /mi</span>';
      }
      if (a.activity.durationSecs) {
        html += '<span class="activity-stat-duration">' + fmtDuration(a.activity.durationSecs) + '</span>';
      }
      html += '</div>';
    }

    // Narrative (if present)
    if (a.narrative) {
      html += '<p class="activity-narrative">' + a.narrative + '</p>';
    }

    // Bottom row: source badge + location
    html += '<div class="activity-meta">';
    if (a.source && a.source.platform) {
      var plat = a.source.platform;
      html += '<span class="source-badge src-' + plat + '">';
      html += (SOURCE_ICONS[plat] || SOURCE_ICONS.manual);
      html += (SOURCE_LABELS[plat] || "manual entry");
      html += '</span>';
    }
    if (a.location && a.location.city) {
      var loc = a.location.city + (a.location.state ? ", " + a.location.state : "");
      html += '<span class="activity-location">' + loc + '</span>';
    }
    html += '</div>';

    html += '<div class="mod-insert" data-mod-user="' + a.user + '"></div>';
    html += '</div>';
    return html;
  }

  var PACE_BANDS = {
    "sub-7": {
      label: "Sub-7:00 /mi",
      range: "< 7:00",
      min: 0,
      max: 7,
      desc: "Competitive and elite runners. This space is for those pushing the edge — performance-focused training talk, race strategy, and the pursuit of speed.",
      accentColor: "var(--cobalt)",
      memberCount: "890",
      activity: [
        { user: "Erik S.", activity: { type: "run", distanceMi: 20.0, durationSecs: 7040, avgPaceSecsPerMi: 352 }, source: { platform: "garmin" }, location: { city: "Denver", state: "CO" }, time: "1 hour ago", narrative: "tune-up run for upcoming marathon" },
        { user: "Coach T", activity: null, source: { platform: "manual" }, location: null, time: "4 hours ago", narrative: "shared a threshold workout: 6×1 mile at 10K pace with 60s jog recovery" },
        { user: "Leah P.", activity: null, source: { platform: "manual" }, location: null, time: "7 hours ago", narrative: "asked: \u201CFavorite carbon-plated racer for narrow feet?\u201D — 16 replies" },
      ]
    },
    "7-9": {
      label: "7:00–9:00 /mi",
      range: "7:00 – 9:00",
      min: 7,
      max: 9,
      desc: "Experienced and intermediate runners. You've put in the miles and you're chasing goals — whether that's a BQ, a sub-20 5K, or just getting faster every season.",
      accentColor: "var(--violet)",
      memberCount: "2.1K",
      activity: [
        { user: "Jordan R.", activity: { type: "run", distanceMi: 14.0, durationSecs: 6650, avgPaceSecsPerMi: 475 }, source: { platform: "strava" }, location: { city: "Austin", state: "TX" }, time: "2 hours ago", narrative: "logged a long run in 90\u00B0 heat. \u201CNot pretty but got it done.\u201D" },
        { user: "Sophia M.", activity: null, source: { platform: "manual" }, location: null, time: "5 hours ago", narrative: "shared her sub-1:40 half marathon race plan with pacing splits" },
        { user: "Dan W.", activity: null, source: { platform: "manual" }, location: null, time: "9 hours ago", narrative: "asked: \u201CHow do you handle speedwork during summer humidity?\u201D — 23 replies" },
      ]
    },
    "9-11": {
      label: "9:00–11:00 /mi",
      range: "9:00 – 11:00",
      min: 9,
      max: 11,
      desc: "Building endurance and consistency. This is the heart of running — people showing up day after day, putting in the work, and getting stronger together.",
      accentColor: "var(--magenta)",
      memberCount: "3.4K",
      activity: [
        { user: "Rachel K.", activity: { type: "run", distanceMi: 10.0, durationSecs: 6150, avgPaceSecsPerMi: 615 }, source: { platform: "apple_health" }, location: { city: "Portland", state: "OR" }, time: "1 hour ago", narrative: "completed her first double-digit run" },
        { user: "Mike D.", activity: null, source: { platform: "manual" }, location: null, time: "3 hours ago", narrative: "asked: \u201CHeart rate zones seem off with my watch. Should I trust feel instead?\u201D" },
        { user: "Coach L.", activity: null, source: { platform: "manual" }, location: null, time: "8 hours ago", narrative: "posted a guide on negative splitting for first-time half marathoners" },
      ]
    },
    "11-plus": {
      label: "11:00+ /mi",
      range: "11:00+",
      min: 11,
      max: 99,
      desc: "All paces welcome — run/walk friendly. This space is for anyone who's moving forward. No pace too slow, no distance too short. You're a runner.",
      accentColor: "var(--lime)",
      memberCount: "1.6K",
      activity: [
        { user: "Tanya G.", activity: { type: "run", distanceMi: 3.1, durationSecs: 2304, avgPaceSecsPerMi: 743 }, source: { platform: "coros" }, location: { city: "Atlanta", state: "GA" }, time: "2 hours ago", narrative: "finished her first 5K using run/walk intervals — 38:24 and smiling" },
        { user: "Pat J.", activity: null, source: { platform: "manual" }, location: null, time: "5 hours ago", narrative: "asked: \u201CBest shoes for heavier runners?\u201D — 19 thoughtful recommendations" },
        { user: "Coach Em", activity: null, source: { platform: "manual" }, location: null, time: "11 hours ago", narrative: "posted: \u201CComparison is the thief of joy. Your 13-minute mile counts just as much.\u201D" },
      ]
    },
  };

  var pathname = window.location.pathname;
  var slug = pathname.split("/").pop() || "sub-7";
  var band = PACE_BANDS[slug] || PACE_BANDS["sub-7"];

  var container = document.getElementById("pace-content");

  // Show skeleton loading briefly
  container.innerHTML = '<div class="skeleton-card" style="margin-bottom:16px;"><div class="skeleton-line" style="width:60%;"></div><div class="skeleton-line" style="width:80%;"></div><div class="skeleton-line"></div></div>';

  setTimeout(function() {
    container.innerHTML = "";

    var html = '';
    html += '<div class="flex items-start gap-6 flex-wrap" style="margin-bottom:32px;">';
    html += '<div class="pace-card" style="width:140px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;"><span class="pace-range" style="font-size:28px;">' + band.range + '</span><span class="text-xs text-muted mt-2">per mile</span></div>';
    html += '<div style="flex:1;min-width:260px;">';
    html += '<h1 class="font-display" style="font-size:40px;font-weight:900;letter-spacing:-0.03em;line-height:1.1;">' + band.label + '</h1>';
    html += '<p class="text-lg text-muted mt-2 leading-relaxed">' + band.desc + '</p>';
    html += '<div class="flex gap-6 mt-3 text-sm">';
    html += '<span style="color:' + band.accentColor + ';font-weight:600;">' + band.memberCount + ' members</span>';
    html += '<span class="text-muted">•</span>';
    html += '<span class="text-muted">Active daily</span>';
    html += '</div></div></div>';
    container.innerHTML = html;

    // Activity feed
    var activity = '<div>';
    activity += '<h2 class="font-display text-2xl font-bold mb-4">Recent activity</h2>';

    if (band.activity && band.activity.length > 0) {
      band.activity.forEach(function(a) {
        activity += renderActivityCard(a);
      });
    } else {
      activity += '<div class="empty-state"><p class="text-muted">No runners here yet — be the first.</p><a href="/onboarding/first-timer" class="btn btn-primary mt-4" style="font-size:13px;">Map your roadmap</a></div>';
    }

    activity += '</div>';
    container.innerHTML += activity;

    // Populate mod actions
    try {
      var inserts = container.querySelectorAll(".mod-insert");
      for (var i = 0; i < inserts.length; i++) {
        var user = inserts[i].getAttribute("data-mod-user");
        if (user) { inserts[i].appendChild(moderationActions(user)); }
      }
      if (typeof hideBlockedContent === "function") hideBlockedContent();
    } catch(e) {}
  }, 300);
})();
</script>

<script>
(function() {
  if (localStorage.getItem('cookieConsent') === 'true') return;
  var banner = document.createElement('div');
  banner.id = 'cookie-banner';
  banner.innerHTML = '<div style="position:fixed;bottom:0;left:0;right:0;background:var(--surface-1);border-top:1px solid var(--border-visible);padding:16px 24px;z-index:9999;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,0.06);"><p style="font-size:13px;color:var(--text-muted);margin:0;flex:1;min-width:200px;">Stride uses cookies for core functionality, analytics, and affiliate links. See our <a href="/cookies" style="color:var(--cobalt);text-decoration:underline;">Cookie Policy</a> for details.</p><div style="display:flex;gap:8px;flex-shrink:0;"><button id="cookie-accept" class="btn btn-primary" style="padding:10px 20px;font-size:13px;">Accept all</button><a href="/cookies" class="btn btn-secondary" style="padding:10px 20px;font-size:13px;">Cookie settings</a></div></div>';
  document.body.appendChild(banner);
  document.getElementById('cookie-accept').addEventListener('click', function() {
    localStorage.setItem('cookieConsent', 'true');
    document.getElementById('cookie-banner').remove();
  });
})();
</script>

</body>
</html>
